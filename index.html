<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpecialWish Studio - Custom Flow Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand: #e11d48;
      --brand-soft: #ffe4e6;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100dvh;
      padding: 16px 16px 40px 16px;
      display: flex;
      justify-content: center;
    }
    .app-shell {
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }
    .app-header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }
    .badge-clean {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      color: #334155;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .card-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .step-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .input-field {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: var(--text-main);
      margin-bottom: 10px;
      transition: border 0.15s;
    }
    .input-field:focus {
      border-color: var(--brand);
      background: #fff;
    }
    textarea.input-field {
      height: 90px;
      resize: none;
      line-height: 1.5;
    }
    select.input-field {
      cursor: pointer;
      font-weight: 600;
    }

    /* Stage Slot Builder */
    .stage-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
    }
    .stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .stage-number {
      font-size: 12px;
      font-weight: 800;
      color: var(--brand);
    }
    .btn-remove-stage {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-add-stage {
      width: 100%;
      padding: 11px;
      background: #f1f5f9;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn-add-stage:active { transform: scale(0.98); }

    .btn-action {
      width: 100%;
      padding: 14px;
      background: var(--text-main);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
      transition: 0.2s;
    }
    .btn-action:active { transform: scale(0.98); }
    #result-box {
      display: none;
      background: #f0fdf4;
      border: 1px dashed #22c55e;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-top: 14px;
    }

    .dev-branding {
      text-align: center;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .dev-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div class="app-header">
      <div class="badge-clean"><i class="fa-solid fa-wand-magic-sparkles"></i> Custom Experience Builder</div>
      <h1>SpecialWish Flow</h1>
      <p class="subtitle">Design slide-by-slide interactive scratch, meters & custom buttons.</p>
    </div>

    <!-- Step 1: Basic Info -->
    <div class="card-panel">
      <div class="step-title"><span><i class="fa-solid fa-user"></i> 1. Basic Details</span></div>
      <input type="text" id="target-name" class="input-field" placeholder="Who is this for? (Name / Nickname)">
      <input type="text" id="event-tag" class="input-field" placeholder="Category tag (e.g. For My Love, Birthday, Sorry)" value="Special Secret ❤️">
    </div>

    <!-- Step 2: Custom Multi-Stage Flow -->
    <div class="card-panel">
      <div class="step-title">
        <span><i class="fa-solid fa-layer-group"></i> 2. Slide-by-Slide Stages</span>
        <span style="font-size:10px; color:var(--text-muted);">Choose style for each</span>
      </div>

      <div id="stages-container"></div>

      <button type="button" class="btn-add-stage" onclick="addStageSlot()">
        <i class="fa-solid fa-plus"></i> Add Next Slide / Stage
      </button>
    </div>

    <!-- Step 3: Music & Lock -->
    <div class="card-panel">
      <div class="step-title"><span><i class="fa-solid fa-sliders"></i> 3. Audio & Sharing</span></div>
      <input type="text" id="yt-song" class="input-field" placeholder="YouTube song URL (Background audio)">
      <input type="password" id="secret-pin" class="input-field" maxlength="4" placeholder="4-Digit unlock code (Optional)">
      <input type="text" id="my-insta" class="input-field" placeholder="Your Instagram (for direct reply)">

      <button type="button" class="btn-action" onclick="publishFlow()">
        <i class="fa-solid fa-rocket"></i> Create Multi-Slide Surprise
      </button>

      <div id="result-box">
        <p style="font-size:12px; font-weight:700; color:#16a34a; margin-bottom:8px;">✔ Multi-Stage Flow is Live!</p>
        <input type="text" id="out-url" class="input-field" readonly style="text-align:center; font-weight:700; color:var(--brand);">
        <button class="btn-action" style="padding:10px; font-size:13px;" onclick="copyUrl()">
          <i class="fa-regular fa-copy"></i> Copy Link
        </button>
      </div>
    </div>

    <!-- Branding -->
    <div class="dev-branding">
      <a href="https://instagram.com/madxninja_" target="_blank" class="dev-pill">
        <i class="fa-brands fa-instagram" style="color:var(--brand);"></i>
        <span>Designed & Developed by @madxninja_</span>
      </a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlYdZljqsNcZvlky107-spvhIH7235UTk",
      databaseURL: "https://cyberwish-521fd-default-rtdb.firebaseio.com",
      projectId: "cyberwish-521fd",
      appId: "1:158188886863:web:c04bac173f7a141732933a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let stages = [];

    window.onload = () => {
      // Default 2 stages to start with
      addStageSlot('scratch', 'You are the most precious part of my life. Never forget that! ✨');
      addStageSlot('question', 'Will you always smile like this?', 'Yes forever! ❤️', 'No way 😜', true);
    };

    function addStageSlot(type = 'scratch', text = '', yesTxt = 'Yes! ❤️', noTxt = 'No 🥺', runAway = true) {
      const id = Date.now() + Math.random();
      stages.push({ id, type, text, yesTxt, noTxt, runAway });
      renderStages();
    }

    function removeStageSlot(id) {
      if (stages.length <= 1) return alert("At least 1 slide is required!");
      stages = stages.filter(s => s.id !== id);
      renderStages();
    }

    function updateStageType(id, newType) {
      const s = stages.find(item => item.id === id);
      if (s) {
        s.type = newType;
        renderStages();
      }
    }

    function renderStages() {
      const box = document.getElementById('stages-container');
      box.innerHTML = "";

      stages.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'stage-item';

        div.innerHTML = `
          <div class="stage-top">
            <span class="stage-number">Slide ${idx + 1}</span>
            <button type="button" class="btn-remove-stage" onclick="removeStageSlot(${s.id})"><i class="fa-solid fa-trash"></i></button>
          </div>

          <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Action on this slide:</label>
          <select class="input-field" onchange="updateStageType(${s.id}, this.value)">
            <option value="scratch" ${s.type === 'scratch' ? 'selected' : ''}>✨ Scratch Card Reveal</option>
            <option value="gussa" ${s.type === 'gussa' ? 'selected' : ''}>🥺 Gussa Defuse Slider (100% to 0%)</option>
            <option value="hug" ${s.type === 'hug' ? 'selected' : ''}>🫂 3-Second Hold to Hug / Promise</option>
            <option value="question" ${s.type === 'question' ? 'selected' : ''}>❓ Custom Question (Custom Yes / No)</option>
            <option value="note" ${s.type === 'note' ? 'selected' : ''}>💌 Soft Heartfelt Note (Read Only)</option>
          </select>

          <!-- Input for Message -->
          <textarea class="input-field" placeholder="Write message/note for this slide..." oninput="stages[${idx}].text = this.value">${s.text || ''}</textarea>

          <!-- Extra inputs if Question is selected -->
          <div id="q-extra-${s.id}" style="display: ${s.type === 'question' ? 'block' : 'none'}; background:#fff; padding:10px; border-radius:12px; border:1px solid #e2e8f0; margin-top:4px;">
            <label style="font-size:11px; font-weight:700; color:#334155; display:block; margin-bottom:4px;">Customize Button Texts:</label>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
              <input type="text" class="input-field" style="margin-bottom:0; flex:1;" placeholder="Yes button text" value="${s.yesTxt || 'Yes! ❤️'}" oninput="stages[${idx}].yesTxt = this.value">
              <input type="text" class="input-field" style="margin-bottom:0; flex:1;" placeholder="No button text" value="${s.noTxt || 'No 🥺'}" oninput="stages[${idx}].noTxt = this.value">
            </div>
            <label style="font-size:11px; font-weight:700; color:#64748b; display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" ${s.runAway ? 'checked' : ''} onchange="stages[${idx}].runAway = this.checked">
              Make 'No' button run away when tapped! 😉
            </label>
          </div>
        `;
        box.appendChild(div);
      });
    }

    function extractYouTubeID(url) {
      if (!url) return null;
      const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(reg);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function makeKey() {
      const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let r = "";
      for (let i = 0; i < 6; i++) r += c.charAt(Math.floor(Math.random() * c.length));
      return r;
    }

    function publishFlow() {
      const name = document.getElementById('target-name').value.trim() || 'Special One';
      const cat = document.getElementById('event-tag').value.trim() || 'Special Wish ❤️';
      const ytId = extractYouTubeID(document.getElementById('yt-song').value.trim());
      const pin = document.getElementById('secret-pin').value.trim();
      const insta = document.getElementById('my-insta').value.trim().replace('@', '');

      const key = makeKey();
      db.ref('custom_flows/' + key).set({
        name: name,
        category: cat,
        stages: stages,
        ytId: ytId || null,
        pin: pin || null,
        replyInsta: insta || null,
        createdAt: Date.now()
      }).then(() => {
        const full = new URL('view.html?id=' + key, window.location.href).href;
        document.getElementById('out-url').value = full;
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('result-box').scrollIntoView({ behavior: 'smooth' });
      });
    }

    function copyUrl() {
      const b = document.getElementById('out-url');
      b.select();
      navigator.clipboard.writeText(b.value);
      alert("Surprise flow link copied to clipboard!");
    }
  </script>
</body>
</html>
