<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpecialWish - App Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand: #e11d48;
      --brand-soft: #ffe4e6;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100dvh;
      padding: 16px 16px 40px 16px;
      display: flex;
      justify-content: center;
    }
    .app-shell {
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }
    .app-header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }
    .badge-clean {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      color: #334155;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .card-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .step-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .mood-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px 10px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .mood-pill.active {
      background: var(--brand-soft);
      border-color: var(--brand);
      color: var(--brand);
      font-weight: 700;
    }
    .input-field {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: var(--text-main);
      margin-bottom: 10px;
      transition: border 0.15s;
    }
    .input-field:focus {
      border-color: var(--brand);
      background: #fff;
    }
    textarea.input-field {
      height: 120px;
      resize: none;
      line-height: 1.5;
    }
    .btn-action {
      width: 100%;
      padding: 14px;
      background: var(--text-main);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
      transition: 0.2s;
    }
    .btn-action:active { transform: scale(0.98); }
    #result-box {
      display: none;
      background: #f0fdf4;
      border: 1px dashed #22c55e;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-top: 14px;
    }

    .dev-branding {
      text-align: center;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .dev-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: 0.2s;
    }
    .dev-pill:active { transform: scale(0.96); }
    .dev-pill i { color: #e11d48; font-size: 13px; }
    .dev-caption { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="app-shell">
    <div class="app-header">
      <div class="badge-clean"><i class="fa-solid fa-heart"></i> For Someone Special</div>
      <h1>SpecialWish Studio</h1>
      <p class="subtitle">Interactive scratch, apology meters & personal surprises.</p>
    </div>

    <div class="card-panel">
      <div class="step-title"><i class="fa-solid fa-sparkles"></i> 1. Choose Intention</div>
      <div class="mood-grid">
        <button type="button" class="mood-pill active" onclick="setMood(this, 'sorry')"><i class="fa-solid fa-heart-crack"></i> Sorry / Manana</button>
        <button type="button" class="mood-pill" onclick="setMood(this, 'love')"><i class="fa-solid fa-heart"></i> Love & Proposal</button>
        <button type="button" class="mood-pill" onclick="setMood(this, 'birthday')"><i class="fa-solid fa-cake-candles"></i> Birthday Wish</button>
        <button type="button" class="mood-pill" onclick="setMood(this, 'bestie')"><i class="fa-solid fa-user-group"></i> Best Friend</button>
      </div>
    </div>

    <div class="card-panel">
      <div class="step-title"><i class="fa-solid fa-envelope"></i> 2. Who & Secret Note</div>
      <input type="text" id="target-name" class="input-field" placeholder="Who is this for? (Name / Nickname)">
      <textarea id="hidden-msg" class="input-field" placeholder="Write from your heart... It will be unlocked through interactive actions!"></textarea>
    </div>

    <div class="card-panel">
      <div class="step-title"><i class="fa-solid fa-sliders"></i> 3. Audio & Passcode</div>
      <input type="text" id="yt-song" class="input-field" placeholder="YouTube song URL (Audio plays in background)">
      <input type="password" id="secret-pin" class="input-field" maxlength="4" placeholder="4-Digit unlock code (Optional)">
      <input type="text" id="my-insta" class="input-field" placeholder="Your Instagram username (for direct reply)">

      <button type="button" class="btn-action" onclick="createSurprise()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Special Link
      </button>

      <div id="result-box">
        <p style="font-size:12px; font-weight:700; color:#16a34a; margin-bottom:8px;">✔ Special Link Ready to Share!</p>
        <input type="text" id="out-url" class="input-field" readonly style="text-align:center; font-weight:700; color:var(--brand);">
        <button class="btn-action" style="padding:10px; font-size:13px;" onclick="copyUrl()">
          <i class="fa-regular fa-copy"></i> Copy Link
        </button>
      </div>
    </div>

    <div class="dev-branding">
      <a href="https://instagram.com/madxninja_" target="_blank" class="dev-pill">
        <i class="fa-brands fa-instagram"></i>
        <span>Designed & Developed by @madxninja_</span>
      </a>
      <span class="dev-caption">Crafted with care for your closest connections</span>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlYdZljqsNcZvlky107-spvhIH7235UTk",
      databaseURL: "https://cyberwish-521fd-default-rtdb.firebaseio.com",
      projectId: "cyberwish-521fd",
      appId: "1:158188886863:web:c04bac173f7a141732933a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let selectedMood = 'sorry';

    const defaultNotes = {
      sorry: "I know I made a mistake, and your silence hurts more than anything. I promise to be better, listen more, and never let this happen again. Please forgive me? 🥺",
      love: "In a world where everything changes, my feelings for you only grow stronger each day. You are my home, my peace, and my favorite thought. ❤️",
      birthday: "Wishing the most special human a very Happy Birthday! May your smile never fade and all your quiet dreams turn into reality. 🎂✨",
      bestie: "To my favorite person to be completely crazy with! Thank you for standing by me through every high and low. You are irreplaceable. 🤝🔥"
    };

    document.getElementById('hidden-msg').value = defaultNotes.sorry;

    function setMood(btn, mood) {
      document.querySelectorAll('.mood-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedMood = mood;
      document.getElementById('hidden-msg').value = defaultNotes[mood];
    }

    function extractYouTubeID(url) {
      if (!url) return null;
      const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(reg);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function makeKey() {
      const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let r = "";
      for (let i = 0; i < 6; i++) r += c.charAt(Math.floor(Math.random() * c.length));
      return r;
    }

    function createSurprise() {
      const name = document.getElementById('target-name').value.trim() || 'Special One';
      const msg = document.getElementById('hidden-msg').value.trim() || defaultNotes[selectedMood];
      const ytId = extractYouTubeID(document.getElementById('yt-song').value.trim());
      const pin = document.getElementById('secret-pin').value.trim();
      const insta = document.getElementById('my-insta').value.trim().replace('@', '');

      const key = makeKey();
      db.ref('special_wishes/' + key).set({
        name: name,
        mood: selectedMood,
        message: msg,
        ytId: ytId || null,
        pin: pin || null,
        replyInsta: insta || null,
        createdAt: Date.now()
      }).then(() => {
        const full = new URL('view.html?id=' + key, window.location.href).href;
        document.getElementById('out-url').value = full;
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('result-box').scrollIntoView({ behavior: 'smooth' });
      });
    }

    function copyUrl() {
      const b = document.getElementById('out-url');
      b.select();
      navigator.clipboard.writeText(b.value);
      alert("Surprise link copied to clipboard!");
    }
  </script>
</body>
</html>
