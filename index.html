<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpecialWish Studio - Mobile Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    :root {
      --lamp-clr: #ffd54f;
      --lamp-glow-core: #fff9c4;
      --lamp-glow-strong: rgba(255, 213, 79, 0.65);
      --lamp-glow-soft: rgba(255, 193, 7, 0.25);
      --lamp-beam-start: rgba(255, 235, 150, 0.85);
      --lamp-beam-mid: rgba(255, 213, 79, 0.25);
      --bg-dark-off: #08090c;
      --bg-dark-on: #0e1117;
      --glass-bg: rgba(22, 27, 34, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --brand: #e11d48;
    }

    [data-theme="cyber"] {
      --lamp-clr: #00e5ff;
      --lamp-glow-core: #e0f7fa;
      --lamp-glow-strong: rgba(0, 229, 255, 0.65);
      --lamp-glow-soft: rgba(0, 188, 212, 0.25);
      --lamp-beam-start: rgba(128, 243, 255, 0.85);
      --lamp-beam-mid: rgba(0, 229, 255, 0.25);
    }

    [data-theme="violet"] {
      --lamp-clr: #d500f9;
      --lamp-glow-core: #f3e5f5;
      --lamp-glow-strong: rgba(213, 0, 249, 0.65);
      --lamp-glow-soft: rgba(171, 71, 188, 0.25);
      --lamp-beam-start: rgba(234, 128, 252, 0.85);
      --lamp-beam-mid: rgba(213, 0, 249, 0.25);
    }

    body {
      background-color: var(--bg-dark-off);
      color: var(--text-main);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Mobile Room Layout */
    .room {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #151a24 0%, var(--bg-dark-off) 80%);
      transition: background 0.8s ease;
      padding: 12px 14px 40px 14px;
    }

    .room.on {
      background: radial-gradient(circle at 50% 25%, #19202c 0%, var(--bg-dark-on) 85%);
    }

    /* Sound Switch Button */
    .top-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 100;
    }
    .sound-toggle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(22, 27, 34, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Compact Mobile Lamp Section */
    .lamp-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 230px;
      position: relative;
      z-index: 10;
      padding-top: 10px;
    }

    .lamp-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.9);
      transform-origin: center top;
    }

    .pull-hint {
      position: absolute;
      top: 10px;
      left: calc(50% + 65px);
      background: rgba(20, 24, 33, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffd54f;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      animation: floatH 2s ease-in-out infinite;
    }
    .room.on .pull-hint { opacity: 0; }
    @keyframes floatH { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .lamp-head {
      width: 130px;
      height: 50px;
      background: linear-gradient(135deg, #24292e 0%, #161b22 60%, #0d1117 100%);
      border-radius: 130px 130px 8px 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      position: relative;
      z-index: 11;
      border-bottom: 2px solid #111418;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .lamp-inner-bulb {
      width: 28px;
      height: 12px;
      background: #2a2e37;
      border-radius: 50% 50% 0 0;
      margin-bottom: 2px;
      transition: 0.3s;
    }
    .room.on .lamp-inner-bulb {
      background: var(--lamp-glow-core);
      box-shadow: 0 0 16px 6px var(--lamp-clr);
    }
    .lamp-glow {
      position: absolute;
      top: 45px;
      width: 90px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 40px 20px var(--lamp-glow-strong);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 10;
      pointer-events: none;
    }
    .room.on .lamp-glow { opacity: 1; }

    .light-beam {
      position: absolute;
      top: 50px;
      width: 360px;
      height: 280px;
      clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
      background: linear-gradient(180deg, var(--lamp-beam-start) 0%, var(--lamp-beam-mid) 45%, transparent 100%);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 6;
      pointer-events: none;
      filter: blur(10px);
    }
    .room.on .light-beam { opacity: 0.85; }

    .lamp-stem {
      width: 6px;
      height: 120px;
      background: linear-gradient(90deg, #111418, #2f3640, #111418);
      z-index: 8;
    }
    .lamp-base {
      width: 90px;
      height: 14px;
      background: linear-gradient(180deg, #24292e, #161b22);
      border-radius: 30px 30px 4px 4px;
      border-bottom: 2px solid #090c10;
      z-index: 9;
    }

    /* Pull String Handle */
    .string-svg {
      position: absolute;
      top: 48px;
      left: calc(50% + 48px);
      width: 4px;
      height: 4px;
      overflow: visible;
      z-index: 10;
      pointer-events: none;
    }
    .string-svg path {
      stroke: #7d8590;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .string-handle {
      position: absolute;
      top: 130px;
      left: calc(50% + 43px);
      width: 14px;
      height: 24px;
      background: linear-gradient(180deg, #f7d56e 0%, #c49826 60%, #7e5e0f 100%);
      border-radius: 6px;
      cursor: grab;
      z-index: 12;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.8);
    }

    /* Card Section Mobile Fit */
    .content-section {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      z-index: 20;
    }

    .login-card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 22px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .room.on .login-card {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Tabs */
    .form-tabs {
      display: flex;
      background: rgba(13, 17, 23, 0.6);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .input-field {
      width: 100%;
      background: rgba(13, 17, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: #fff;
      margin-bottom: 10px;
    }
    .input-field:focus {
      border-color: var(--lamp-clr);
    }
    textarea.input-field {
      height: 80px;
      resize: none;
    }

    .btn-action {
      width: 100%;
      padding: 13px;
      background: var(--lamp-clr);
      color: #0d1117;
      font-size: 14px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--lamp-glow-soft);
    }
    .btn-action:active { transform: scale(0.98); }

    .guest-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dashboard Slots */
    #dashboard-view { display: none; }
    .stage-item {
      background: rgba(13, 17, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .stage-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 800;
      color: var(--lamp-clr);
    }
    .btn-add-stage {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      color: #c9d1d9;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .dev-branding {
      text-align: center;
      margin-top: 18px;
    }
    .dev-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e6edf3;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Sound Toggle -->
  <div class="top-controls">
    <button class="sound-toggle" id="soundToggle">
      <i class="fa-solid fa-volume-high" id="soundIcon"></i>
    </button>
  </div>

  <main class="room" id="room">
    
    <!-- Lamp Component (Mobile Fitted) -->
    <div class="lamp-section">
      <div class="lamp-container" id="lampContainer">
        <div class="pull-hint">Pull cord to open 💡</div>
        <div class="lamp-glow"></div>
        <div class="lamp-head">
          <div class="lamp-inner-bulb"></div>
        </div>
        <div class="light-beam"></div>
        <div class="lamp-stem"></div>
        <div class="lamp-base"></div>

        <svg class="string-svg">
          <path id="stringPath" d="M 0 0 L 0 85"></path>
        </svg>

        <div class="string-handle" id="stringHandle"></div>
      </div>
    </div>

    <!-- Login & Creator Card -->
    <div class="content-section">
      <div class="login-card" id="loginCard">
        
        <!-- Login Panel -->
        <div id="auth-view">
          <div class="form-tabs">
            <button type="button" class="tab-btn active" id="btnTabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
            <button type="button" class="tab-btn" id="btnTabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
          </div>

          <div style="text-align:center; margin-bottom:14px;">
            <h2 style="font-size:20px; font-weight:800; color:#fff;" id="auth-title">Welcome Back</h2>
            <p style="font-size:12px; color:var(--text-muted); margin-top:3px;" id="auth-sub">Pull lamp cord to reveal workspace</p>
          </div>

          <form onsubmit="handleAuthSubmit(event)">
            <input type="text" id="auth-name" class="input-field" placeholder="Your Name" style="display:none;">
            <input type="email" id="auth-email" class="input-field" placeholder="Email Address" required>
            <input type="password" id="auth-pass" class="input-field" placeholder="Password" required>

            <button type="submit" class="btn-action" id="auth-submit-btn">Sign In to Studio</button>
            <button type="button" class="guest-btn" onclick="directGuestLogin()">Direct Guest Access (No Password) →</button>
          </form>
        </div>

        <!-- Dashboard Panel -->
        <div id="dashboard-view">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div>
              <span style="font-size:10px; font-weight:800; color:var(--lamp-clr); text-transform:uppercase;">SpecialWish Studio</span>
              <h2 style="font-size:16px; font-weight:800; color:#fff;" id="user-greeting">Hi, Creator</h2>
            </div>
            <button onclick="logoutStudio()" style="background:none; border:none; color:var(--text-muted); font-size:11px; cursor:pointer;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</button>
          </div>

          <input type="text" id="target-name" class="input-field" placeholder="Who is this for? (Name / Nickname)">
          <input type="text" id="event-tag" class="input-field" placeholder="Event tag (e.g. Birthday, Sorry, Love)" value="Special Secret ❤️">

          <div style="font-size:11px; font-weight:800; color:var(--text-muted); margin:10px 0 6px 0;">INTERACTIVE SLIDES:</div>
          <div id="stages-container"></div>

          <button type="button" class="btn-add-stage" onclick="addStageSlot()">
            <i class="fa-solid fa-plus"></i> Add Next Slide
          </button>

          <input type="text" id="yt-song" class="input-field" placeholder="YouTube song URL (Background music)">
          <input type="password" id="secret-pin" class="input-field" maxlength="4" placeholder="4-Digit secret code (Optional)">
          <input type="text" id="my-insta" class="input-field" placeholder="Your Instagram (for reaction DM)">

          <button type="button" class="btn-action" onclick="publishFlow()">
            <i class="fa-solid fa-rocket"></i> Publish & Get Link
          </button>

          <div id="result-box" style="display:none; background:rgba(34,197,94,0.15); border:1px dashed #22c55e; border-radius:12px; padding:12px; text-align:center; margin-top:12px;">
            <p style="font-size:11.5px; font-weight:700; color:#4ade80; margin-bottom:6px;">✔ Link Ready!</p>
            <input type="text" id="out-url" class="input-field" readonly style="text-align:center; font-weight:700; color:var(--lamp-clr); margin-bottom:8px;">
            <button class="btn-action" style="padding:9px; font-size:12px;" onclick="copyUrl()">
              <i class="fa-regular fa-copy"></i> Copy Link
            </button>
          </div>
        </div>

        <!-- Branding -->
        <div class="dev-branding">
          <a href="https://instagram.com/madxninja_" target="_blank" class="dev-pill">
            <i class="fa-brands fa-instagram" style="color:var(--brand);"></i>
            <span>Designed & Developed by @madxninja_</span>
          </a>
        </div>

      </div>
    </div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlYdZljqsNcZvlky107-spvhIH7235UTk",
      databaseURL: "https://cyberwish-521fd-default-rtdb.firebaseio.com",
      projectId: "cyberwish-521fd",
      appId: "1:158188886863:web:c04bac173f7a141732933a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Procedural Sound
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (type === 'switch') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(1000, now);
        osc.frequency.exponentialRampToValueAtTime(250, now + 0.06);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'pull') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    document.getElementById('soundToggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundIcon').className = soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
    });

    // Lamp String & Physics
    const THEMES = ['warm', 'cyber', 'violet'];
    let currentThemeIdx = -1;
    let isOn = false;
    let isDragging = false;
    let startY = 0;
    let curY = 0;
    let springId = null;

    const room = document.getElementById('room');
    const handle = document.getElementById('stringHandle');
    const path = document.getElementById('stringPath');

    function applyTheme(t) {
      if (t === 'warm') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
    }

    function setLamp(on) {
      isOn = on;
      room.classList.toggle('on', isOn);
      playSound('switch');
    }

    function triggerPull() {
      currentThemeIdx = (currentThemeIdx + 1) % (THEMES.length + 1);
      if (currentThemeIdx === THEMES.length) {
        setLamp(false);
        currentThemeIdx = -1;
      } else {
        applyTheme(THEMES[currentThemeIdx]);
        if (!isOn) setLamp(true);
        else playSound('switch');
      }
    }

    function updateString(y) {
      path.setAttribute('d', `M 0 0 Q 0 ${(85 + y) * 0.5} 0 ${85 + y}`);
      handle.style.transform = `translateY(${y}px)`;
    }

    function startSpring(initY) {
      cancelAnimationFrame(springId);
      let y = initY;
      let vy = 0;
      function step() {
        vy = (vy - 0.16 * y) * 0.78;
        y += vy;
        updateString(y);
        if (Math.abs(y) > 0.2 || Math.abs(vy) > 0.2) springId = requestAnimationFrame(step);
        else updateString(0);
      }
      springId = requestAnimationFrame(step);
    }

    handle.addEventListener('pointerdown', (e) => {
      isDragging = true;
      cancelAnimationFrame(springId);
      startY = e.clientY;
      curY = 0;
      handle.setPointerCapture?.(e.pointerId);
      playSound('pull');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      curY = Math.max(0, Math.min(130, (e.clientY - startY) * 0.75));
      updateString(curY);
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      if (curY > 30) triggerPull();
      startSpring(curY);
    });

    // Auth & Dash Navigation
    function switchAuthTab(mode) {
      document.getElementById('btnTabSignIn').classList.toggle('active', mode === 'signin');
      document.getElementById('btnTabSignUp').classList.toggle('active', mode === 'signup');
      document.getElementById('auth-name').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('auth-title').innerText = mode === 'signin' ? 'Welcome Back' : 'Create Account';
      document.getElementById('auth-submit-btn').innerText = mode === 'signin' ? 'Sign In to Studio' : 'Create Studio Account';
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const name = document.getElementById('auth-name').value.trim() || email.split('@')[0];
      unlockDashboard(name);
    }

    function directGuestLogin() {
      unlockDashboard("Special Guest");
    }

    function unlockDashboard(userName) {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      document.getElementById('user-greeting').innerText = `Hi, ${userName} ✨`;
      if (stages.length === 0) {
        addStageSlot('scratch', 'You are truly one in a million. Never forget your worth! ✨');
        addStageSlot('question', 'Will you stay with me forever?', 'Yes Forever! ❤️', 'No way 😜', true);
      }
    }

    function logoutStudio() {
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('auth-view').style.display = 'block';
    }

    // Pipeline Builder
    let stages = [];

    function addStageSlot(type = 'scratch', text = '', yesTxt = 'Yes! ❤️', noTxt = 'No 🥺', runAway = true) {
      const id = Date.now() + Math.random();
      stages.push({ id, type, text, yesTxt, noTxt, runAway });
      renderStages();
    }

    function removeStageSlot(id) {
      if (stages.length <= 1) return alert("At least 1 slide is required!");
      stages = stages.filter(s => s.id !== id);
      renderStages();
    }

    function updateStageType(id, newType) {
      const s = stages.find(item => item.id === id);
      if (s) { s.type = newType; renderStages(); }
    }

    function renderStages() {
      const box = document.getElementById('stages-container');
      box.innerHTML = "";
      stages.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'stage-item';
        div.innerHTML = `
          <div class="stage-top">
            <span>Slide ${idx + 1}</span>
            <button type="button" onclick="removeStageSlot(${s.id})" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
          </div>
          <select class="input-field" onchange="updateStageType(${s.id}, this.value)">
            <option value="scratch" ${s.type === 'scratch' ? 'selected' : ''}>✨ Scratch Card Reveal</option>
            <option value="gussa" ${s.type === 'gussa' ? 'selected' : ''}>🥺 Gussa Defuse Meter (100% to 0%)</option>
            <option value="hug" ${s.type === 'hug' ? 'selected' : ''}>🫂 3-Second Hold to Hug / Promise</option>
            <option value="question" ${s.type === 'question' ? 'selected' : ''}>❓ Custom Question (Custom Buttons)</option>
            <option value="note" ${s.type === 'note' ? 'selected' : ''}>💌 Soft Heartfelt Note (Read Only)</option>
          </select>
          <textarea class="input-field" placeholder="Note / Question for this slide..." oninput="stages[${idx}].text = this.value">${s.text || ''}</textarea>
          <div style="display: ${s.type === 'question' ? 'block' : 'none'}; background:rgba(0,0,0,0.2); padding:8px; border-radius:10px;">
            <div style="display:flex; gap:6px; margin-bottom:6px;">
              <input type="text" class="input-field" style="margin-bottom:0;" placeholder="Yes Text" value="${s.yesTxt || 'Yes! ❤️'}" oninput="stages[${idx}].yesTxt = this.value">
              <input type="text" class="input-field" style="margin-bottom:0;" placeholder="No Text" value="${s.noTxt || 'No 🥺'}" oninput="stages[${idx}].noTxt = this.value">
            </div>
            <label style="font-size:11px; color:#94a3b8; display:flex; align-items:center; gap:6px;">
              <input type="checkbox" ${s.runAway ? 'checked' : ''} onchange="stages[${idx}].runAway = this.checked"> 'No' button runs away
            </label>
          </div>
        `;
        box.appendChild(div);
      });
    }

    function extractYouTubeID(url) {
      if (!url) return null;
      const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(reg);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function makeKey() {
      const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let r = "";
      for (let i = 0; i < 6; i++) r += c.charAt(Math.floor(Math.random() * c.length));
      return r;
    }

    function publishFlow() {
      const name = document.getElementById('target-name').value.trim() || 'Special One';
      const cat = document.getElementById('event-tag').value.trim() || 'Special Wish ❤️';
      const ytId = extractYouTubeID(document.getElementById('yt-song').value.trim());
      const pin = document.getElementById('secret-pin').value.trim();
      const insta = document.getElementById('my-insta').value.trim().replace('@', '');

      const key = makeKey();
      db.ref('custom_flows/' + key).set({
        name: name,
        category: cat,
        stages: stages,
        ytId: ytId || null,
        pin: pin || null,
        replyInsta: insta || null,
        createdAt: Date.now()
      }).then(() => {
        const full = new URL('view.html?id=' + key, window.location.href).href;
        document.getElementById('out-url').value = full;
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('result-box').scrollIntoView({ behavior: 'smooth' });
      });
    }

    function copyUrl() {
      const b = document.getElementById('out-url');
      b.select();
      navigator.clipboard.writeText(b.value);
      alert("Surprise journey link copied!");
    }
  </script>
</body>
</html>
