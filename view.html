<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Special Journey For You ✨</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    .app-card {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 24px 20px;
      text-align: center;
      position: relative;
    }
    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge-tag {
      padding: 4px 12px;
      background: #ffe4e6;
      color: #e11d48;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .slide-indicator {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
    }
    .recipient-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    /* Scratch Canvas */
    .scratch-box {
      position: relative;
      width: 100%;
      height: 170px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }
    .scratch-content {
      position: absolute;
      inset: 0;
      background: #fdf2f8;
      border: 1px dashed #f472b6;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .scratch-text {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
      color: #831843;
      white-space: pre-wrap;
    }
    #scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      border-radius: 16px;
      cursor: crosshair;
    }

    /* Gussa Meter */
    .meter-container {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: left;
    }
    .meter-label {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .slider-range {
      width: 100%;
      height: 8px;
      border-radius: 5px;
      background: #fecdd3;
      outline: none;
      -webkit-appearance: none;
    }
    .slider-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e11d48;
      cursor: pointer;
    }

    /* Hold to Hug */
    .btn-hug {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: #0f172a;
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-hug.unlocked {
      background: #16a34a;
    }

    /* Pure Note Card */
    .note-card {
      background: #fdfaf7;
      border: 1px solid #fed7aa;
      border-radius: 16px;
      padding: 18px;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 600;
      color: #7c2d12;
      margin-bottom: 14px;
      text-align: left;
      white-space: pre-wrap;
    }

    /* Custom Question Arena */
    .q-arena {
      min-height: 110px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn-custom-yes {
      padding: 12px 24px;
      border-radius: 14px;
      background: #16a34a;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
      transition: all 0.2s;
      z-index: 10;
    }
    .btn-custom-no {
      padding: 11px 20px;
      border-radius: 14px;
      background: #ef4444;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      z-index: 20;
    }

    .btn-next-slide {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .btn-insta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 22px;
      border-radius: 14px;
      background: #e11d48;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 16px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    #pin-gate {
      display: none;
      position: absolute;
      inset: 0;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .footer-dev {
      margin-top: 20px;
      font-size: 11px;
      color: #94a3b8;
    }
    .footer-dev a {
      color: #475569;
      font-weight: 700;
      text-decoration: none;
    }

    #yt-hidden { position: absolute; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
  </style>
</head>
<body>

  <div id="yt-hidden"></div>

  <div class="app-card">
    
    <!-- PIN Lock Overlay -->
    <div id="pin-gate">
      <i class="fa-solid fa-lock" style="font-size:32px; color:#e11d48; margin-bottom:10px;"></i>
      <h3 style="font-size:16px;">Protected Secret</h3>
      <p style="font-size:12px; color:#64748b; margin-top:4px; margin-bottom:14px;">Enter the 4-digit code to open</p>
      <input type="password" id="pass-in" maxlength="4" style="width:140px; font-size:24px; text-align:center; letter-spacing:8px; padding:8px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:12px;">
      <button style="padding:10px 20px; background:#e11d48; color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer;" onclick="unlockPin()">Unlock Journey</button>
    </div>

    <div class="top-meta">
      <span class="badge-tag" id="tag-mood">Special Wish</span>
      <span class="slide-indicator" id="slide-num">Slide 1 of 1</span>
    </div>
    <h1 class="recipient-title" id="rec-name">Dearest</h1>

    <!-- Dynamic Container for Active Slide -->
    <div id="slide-body"></div>

    <!-- Next Slide Button -->
    <button type="button" class="btn-next-slide" id="btn-advance" onclick="nextSlide()" style="display:none;">
      Next Step <i class="fa-solid fa-arrow-right"></i>
    </button>

    <!-- Final Stage (Instagram Reply) -->
    <div id="final-screen" style="display:none; margin-top:14px;">
      <div style="font-size:42px; margin-bottom:8px;">❤️</div>
      <h3 style="font-size:18px; margin-bottom:6px;">Journey Completed!</h3>
      <p style="font-size:12.5px; color:#64748b; margin-bottom:14px;" id="final-closing">Send your real-time reaction on Instagram now:</p>
      <a href="#" target="_blank" class="btn-insta" id="reply-insta-btn">
        <i class="fa-brands fa-instagram"></i> Reply on Instagram
      </a>
    </div>

    <!-- Branding -->
    <div class="footer-dev">
      Designed & Developed with ❤️ by <a href="https://instagram.com/madxninja_" target="_blank">@madxninja_</a>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlYdZljqsNcZvlky107-spvhIH7235UTk",
      databaseURL: "https://cyberwish-521fd-default-rtdb.firebaseio.com",
      projectId: "cyberwish-521fd",
      appId: "1:158188886863:web:c04bac173f7a141732933a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let flowData = null;
    let currentIdx = 0;
    let isMusicStarted = false;
    let hugTimer = null;
    let yesScale = 1.0;

    const params = new URLSearchParams(window.location.search);
    const flowId = params.get('id');

    if (flowId) {
      db.ref('custom_flows/' + flowId).once('value').then(snap => {
        if (snap.exists()) {
          flowData = snap.val();
          document.getElementById('tag-mood').innerText = flowData.category || 'Special Secret';
          document.getElementById('rec-name').innerText = flowData.name || 'Special One';

          if (flowData.replyInsta) {
            document.getElementById('reply-insta-btn').href = 'https://instagram.com/' + flowData.replyInsta;
          }

          if (flowData.pin) {
            document.getElementById('pin-gate').style.display = 'flex';
          } else {
            startFlow();
          }
        }
      });
    }

    function unlockPin() {
      const p = document.getElementById('pass-in').value.trim();
      if (p === flowData.pin) {
        document.getElementById('pin-gate').style.display = 'none';
        startFlow();
      } else {
        alert("Incorrect passcode!");
      }
    }

    function playHiddenYT(vid) {
      if (!vid) return;
      const origin = window.location.origin;
      const url = `https://www.youtube.com/embed/${vid}?enablejsapi=1&autoplay=1&loop=1&playlist=${vid}&controls=0&origin=${encodeURIComponent(origin)}`;
      document.getElementById('yt-hidden').innerHTML = `<iframe width="200" height="200" src="${url}" frameborder="0" allow="autoplay"></iframe>`;
    }

    function startFlow() {
      if (flowData.ytId && !isMusicStarted) {
        isMusicStarted = true;
        playHiddenYT(flowData.ytId);
      }
      renderCurrentSlide();
    }

    function renderCurrentSlide() {
      const stages = flowData.stages || [];
      if (currentIdx >= stages.length) {
        // All slides finished -> Show Final Screen
        document.getElementById('slide-body').style.display = 'none';
        document.getElementById('btn-advance').style.display = 'none';
        document.getElementById('slide-num').innerText = 'Completed ✔';
        document.getElementById('final-screen').style.display = 'block';
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        return;
      }

      document.getElementById('slide-num').innerText = `Slide ${currentIdx + 1} of ${stages.length}`;
      const s = stages[currentIdx];
      const body = document.getElementById('slide-body');
      body.innerHTML = "";
      document.getElementById('btn-advance').style.display = 'none';

      if (s.type === 'scratch') {
        body.innerHTML = `
          <div class="scratch-box">
            <div class="scratch-content">
              <div style="font-size:20px; margin-bottom:4px;">✨</div>
              <div class="scratch-text">${s.text || 'You mean everything to me.'}</div>
            </div>
            <canvas id="scratch-canvas"></canvas>
          </div>
        `;
        initScratchCanvas();
      } else if (s.type === 'gussa') {
        body.innerHTML = `
          <p style="font-size:13.5px; font-weight:600; color:#334155; margin-bottom:10px;">${s.text || 'Gussa ho na? Chalo slide karke 0% karo 🥺'}</p>
          <div class="meter-container">
            <div class="meter-label">
              <span>Defuse Gussa:</span>
              <span id="g-pct" style="color:#e11d48; font-weight:800;">100%</span>
            </div>
            <input type="range" min="0" max="100" value="100" class="slider-range" oninput="handleSlideGussa(this.value)">
          </div>
        `;
      } else if (s.type === 'hug') {
        body.innerHTML = `
          <p style="font-size:14px; font-weight:600; color:#334155; margin-bottom:14px;">${s.text || 'Hold to send a warm tight hug 🫂'}</p>
          <button type="button" class="btn-hug" id="h-btn" onmousedown="holdHugStart()" onmouseup="holdHugEnd()" ontouchstart="holdHugStart()" ontouchend="holdHugEnd()">
            <i class="fa-solid fa-heart"></i> <span id="h-lbl">Hold for 3s to Promise</span>
          </button>
        `;
      } else if (s.type === 'question') {
        body.innerHTML = `
          <h3 style="font-size:16px; margin-bottom:14px; color:#0f172a;">${s.text || 'Are you happy now?'}</h3>
          <div class="q-arena" id="q-arena">
            <button class="btn-custom-yes" id="btn-cyes" onclick="handleYesTap()">${s.yesTxt || 'Yes! ❤️'}</button>
            <button class="btn-custom-no" id="btn-cno" onmouseover="dodgeNo(${s.runAway})" onclick="dodgeNo(${s.runAway})">${s.noTxt || 'No 🥺'}</button>
          </div>
        `;
      } else {
        // Pure Note
        body.innerHTML = `
          <div class="note-card">${s.text || 'Just wanted to remind you how special you are to me.'}</div>
        `;
        document.getElementById('btn-advance').style.display = 'flex';
      }
    }

    function nextSlide() {
      currentIdx++;
      renderCurrentSlide();
    }

    /* Scratch Canvas Logic */
    function initScratchCanvas() {
      const canvas = document.getElementById('scratch-canvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#475569';
      ctx.font = 'bold 12px Plus Jakarta Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✨ SCRATCH WITH FINGER ✨', canvas.width / 2, canvas.height / 2 + 4);

      let isDrawing = false;
      let scratchedYet = false;

      function scratch(e) {
        if (!isDrawing) return;
        const b = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - b.left;
        const y = clientY - b.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.fill();

        if (!scratchedYet) {
          scratchedYet = true;
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.5 } });
          document.getElementById('btn-advance').style.display = 'flex';
        }
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
      window.addEventListener('mouseup', () => isDrawing = false);
      window.addEventListener('touchend', () => isDrawing = false);
      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('touchmove', scratch);
    }

    /* Gussa Meter Handling */
    function handleSlideGussa(val) {
      const pct = document.getElementById('g-pct');
      pct.innerText = val + '%';
      if (val == 0) {
        pct.innerText = '0% (Maan Gaye! ❤️)';
        pct.style.color = '#16a34a';
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });
        document.getElementById('btn-advance').style.display = 'flex';
      }
    }

    /* Hold to Hug */
    let hugSec = 0;
    function holdHugStart() {
      const btn = document.getElementById('h-btn');
      if (btn.classList.contains('unlocked')) return;
      hugSec = 0;
      hugTimer = setInterval(() => {
        hugSec++;
        document.getElementById('h-lbl').innerText = `Holding... ${3 - hugSec}s`;
        if (hugSec >= 3) {
          clearInterval(hugTimer);
          btn.classList.add('unlocked');
          document.getElementById('h-lbl').innerText = 'Hug Delivered! ❤️';
          confetti({ particleCount: 80, spread: 80, origin: { y: 0.6 } });
          document.getElementById('btn-advance').style.display = 'flex';
        }
      }, 1000);
    }

    function holdHugEnd() {
      const btn = document.getElementById('h-btn');
      if (btn.classList.contains('unlocked')) return;
      clearInterval(hugTimer);
      document.getElementById('h-lbl').innerText = 'Hold for 3s to Promise';
    }

    /* Custom Yes/No Handling */
    function dodgeNo(shouldRun) {
      if (!shouldRun) return;
      const btnNo = document.getElementById('btn-cno');
      const btnYes = document.getElementById('btn-cyes');
      const arena = document.getElementById('q-arena');

      yesScale += 0.2;
      btnYes.style.transform = `scale(${yesScale})`;

      const maxX = arena.clientWidth - btnNo.clientWidth - 10;
      const maxY = arena.clientHeight - btnNo.clientHeight - 10;

      const rx = (Math.random() - 0.5) * maxX;
      const ry = (Math.random() - 0.5) * maxY;

      btnNo.style.position = 'absolute';
      btnNo.style.left = `${Math.max(5, Math.min(maxX, arena.clientWidth/2 + rx))}px`;
      btnNo.style.top = `${Math.max(5, Math.min(maxY, arena.clientHeight/2 + ry))}px`;
    }

    function handleYesTap() {
      confetti({ particleCount: 90, spread: 80, origin: { y: 0.6 } });
      document.getElementById('btn-advance').style.display = 'flex';
      document.getElementById('btn-advance').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
