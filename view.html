<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Special Surprise For You ✨</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    .app-card {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 24px 20px;
      text-align: center;
      position: relative;
    }
    .badge-mood {
      display: inline-block;
      padding: 4px 12px;
      background: #ffe4e6;
      color: #e11d48;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .recipient-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .scratch-box {
      position: relative;
      width: 100%;
      height: 170px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }
    .scratch-reveal-content {
      position: absolute;
      inset: 0;
      background: #fdf2f8;
      border: 1px dashed #f472b6;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .scratch-text {
      font-size: 13.5px;
      line-height: 1.5;
      font-weight: 600;
      color: #831843;
      white-space: pre-wrap;
    }
    #scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      border-radius: 16px;
      cursor: crosshair;
    }

    .meter-container {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      text-align: left;
    }
    .meter-label {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .slider-range {
      width: 100%;
      height: 8px;
      border-radius: 5px;
      background: #fecdd3;
      outline: none;
      -webkit-appearance: none;
    }
    .slider-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e11d48;
      cursor: pointer;
    }

    .btn-hug {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-hug.unlocked {
      background: #16a34a;
    }

    .btn-insta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 22px;
      border-radius: 14px;
      background: #e11d48;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 16px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    #pin-gate {
      display: none;
      position: absolute;
      inset: 0;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .footer-dev {
      margin-top: 20px;
      font-size: 11px;
      color: #94a3b8;
    }
    .footer-dev a {
      color: #475569;
      font-weight: 700;
      text-decoration: none;
    }

    #yt-hidden { position: absolute; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
  </style>
</head>
<body>

  <div id="yt-hidden"></div>

  <div class="app-card">
    
    <div id="pin-gate">
      <i class="fa-solid fa-lock" style="font-size:32px; color:#e11d48; margin-bottom:10px;"></i>
      <h3 style="font-size:16px;">Protected Secret</h3>
      <p style="font-size:12px; color:#64748b; margin-top:4px; margin-bottom:14px;">Enter the 4-digit code to open</p>
      <input type="password" id="pass-in" maxlength="4" style="width:140px; font-size:24px; text-align:center; letter-spacing:8px; padding:8px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:12px;">
      <button style="padding:10px 20px; background:#e11d48; color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer;" onclick="unlockPin()">Unlock Surprise</button>
    </div>

    <span class="badge-mood" id="tag-mood">Special Wish</span>
    <h1 class="recipient-title" id="rec-name">Dearest</h1>

    <div class="scratch-box">
      <div class="scratch-reveal-content">
        <div style="font-size:22px; margin-bottom:4px;" id="reveal-icon">❤️</div>
        <div class="scratch-text" id="reveal-text">Loading message...</div>
      </div>
      <canvas id="scratch-canvas"></canvas>
    </div>

    <div class="meter-container" id="manana-panel" style="display:none;">
      <div class="meter-label">
        <span>Gussa Defuse Meter</span>
        <span id="gussa-pct" style="color:#e11d48; font-weight:800;">100% Gussa</span>
      </div>
      <input type="range" min="0" max="100" value="100" class="slider-range" id="gussa-slider" oninput="handleGussa(this.value)">
      
      <button type="button" class="btn-hug" id="hug-btn" onmousedown="startHoldHug()" onmouseup="stopHoldHug()" ontouchstart="startHoldHug()" ontouchend="stopHoldHug()">
        <i class="fa-solid fa-heart"></i> <span id="hug-label">Hold for 3s to accept apology</span>
      </button>
    </div>

    <a href="#" target="_blank" class="btn-insta" id="reply-insta-btn" style="display:none;">
      <i class="fa-brands fa-instagram"></i> Send Reply to Sender
    </a>

    <div class="footer-dev">
      Designed & Developed with ❤️ by <a href="https://instagram.com/madxninja_" target="_blank">@madxninja_</a>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlYdZljqsNcZvlky107-spvhIH7235UTk",
      databaseURL: "https://cyberwish-521fd-default-rtdb.firebaseio.com",
      projectId: "cyberwish-521fd",
      appId: "1:158188886863:web:c04bac173f7a141732933a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let wishData = null;
    let isAudioPlayed = false;
    let hugTimer = null;
    let hugSeconds = 0;

    const params = new URLSearchParams(window.location.search);
    const wishId = params.get('id');

    if (wishId) {
      db.ref('special_wishes/' + wishId).once('value').then(snap => {
        if (snap.exists()) {
          wishData = snap.val();
          
          const moodNames = {
            sorry: '🥺 Sincere Apology',
            love: '❤️ Eternal Love',
            birthday: '🎂 Happy Birthday',
            bestie: '🤝 Best Friends Forever'
          };

          document.getElementById('tag-mood').innerText = moodNames[wishData.mood] || 'Special Wish';
          document.getElementById('rec-name').innerText = wishData.name || 'Special One';
          document.getElementById('reveal-text').innerText = wishData.message || '';

          if (wishData.mood === 'sorry') {
            document.getElementById('manana-panel').style.display = 'block';
            document.getElementById('reveal-icon').innerText = '🥺';
          } else if (wishData.mood === 'birthday') {
            document.getElementById('reveal-icon').innerText = '🎂';
          } else if (wishData.mood === 'bestie') {
            document.getElementById('reveal-icon').innerText = '🤝';
          }

          if (wishData.replyInsta) {
            const btn = document.getElementById('reply-insta-btn');
            btn.href = 'https://instagram.com/' + wishData.replyInsta;
            btn.style.display = 'inline-flex';
          }

          if (wishData.pin) {
            document.getElementById('pin-gate').style.display = 'flex';
          } else {
            initScratch();
          }
        }
      });
    }

    function unlockPin() {
      const p = document.getElementById('pass-in').value.trim();
      if (p === wishData.pin) {
        document.getElementById('pin-gate').style.display = 'none';
        initScratch();
      } else {
        alert("Incorrect passcode!");
      }
    }

    function playHiddenYT(vid) {
      if (!vid) return;
      const origin = window.location.origin;
      const url = `https://www.youtube.com/embed/${vid}?enablejsapi=1&autoplay=1&loop=1&playlist=${vid}&controls=0&origin=${encodeURIComponent(origin)}`;
      document.getElementById('yt-hidden').innerHTML = `<iframe width="200" height="200" src="${url}" frameborder="0" allow="autoplay"></iframe>`;
    }

    function initScratch() {
      const canvas = document.getElementById('scratch-canvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      
      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#475569';
      ctx.font = 'bold 12px Plus Jakarta Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✨ SCRATCH GENTLY WITH FINGER ✨', canvas.width / 2, canvas.height / 2 + 4);

      let isDrawing = false;

      function scratch(e) {
        if (!isDrawing) return;
        const b = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - b.left;
        const y = clientY - b.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.fill();

        if (!isAudioPlayed) {
          isAudioPlayed = true;
          if (wishData && wishData.ytId) playHiddenYT(wishData.ytId);
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.5 } });
        }
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });

      window.addEventListener('mouseup', () => isDrawing = false);
      window.addEventListener('touchend', () => isDrawing = false);

      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('touchmove', scratch);
    }

    function handleGussa(val) {
      const pctBox = document.getElementById('gussa-pct');
      pctBox.innerText = val + '% Gussa';
      if (val == 0) {
        pctBox.innerText = '0% (Maan Gaye! 🥺❤️)';
        pctBox.style.color = '#16a34a';
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
      }
    }

    function startHoldHug() {
      const btn = document.getElementById('hug-btn');
      if (btn.classList.contains('unlocked')) return;
      hugSeconds = 0;
      hugTimer = setInterval(() => {
        hugSeconds += 1;
        document.getElementById('hug-label').innerText = `Holding... ${3 - hugSeconds}s`;
        if (hugSeconds >= 3) {
          clearInterval(hugTimer);
          btn.classList.add('unlocked');
          document.getElementById('hug-label').innerText = 'Apology Accepted! ❤️ (Tight Hug)';
          confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
        }
      }, 1000);
    }

    function stopHoldHug() {
      const btn = document.getElementById('hug-btn');
      if (btn.classList.contains('unlocked')) return;
      clearInterval(hugTimer);
      document.getElementById('hug-label').innerText = 'Hold for 3s to accept apology';
    }
  </script>
</body>
</html>
